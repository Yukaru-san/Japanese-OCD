<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>JP OCR Test</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="panels">
      <h1>JP OCR Test</h1>

      <section>
        <h2>Engine</h2>
        <label class="row">
          OCR-Engine
          <select id="engine">
            <option value="auto">Automatisch</option>
            <option value="native">Nativ (ML Kit)</option>
            <option value="web">Web (PaddleOCR, wie eine Webseite)</option>
          </select>
        </label>
        <p id="engine-state" class="muted"></p>
      </section>

      <section>
        <h2>Status</h2>
        <dl>
          <dt>isDeviceSupported</dt>
          <dd id="supported">…</dd>
          <dt>isOcrReady</dt>
          <dd id="ready">…</dd>
          <dt>Kamera-Berechtigung</dt>
          <dd id="permission">…</dd>
          <dt>Handschriftmodell</dt>
          <dd id="handwriting-ready">…</dd>
        </dl>
        <div class="row">
          <button id="refresh">Aktualisieren</button>
          <button id="request-permission">Berechtigung anfragen</button>
        </div>
      </section>

      <section>
        <h2>Live-Kamera</h2>
        <div class="row">
          <button id="start" class="primary">Live starten</button>
        </div>
      </section>

      <section>
        <h2>Bild erkennen</h2>
        <div class="row">
          <button id="gallery" class="primary">Aus Galerie wählen</button>
          <input type="file" id="file" accept="image/*" />
        </div>
        <label class="row"><input type="checkbox" id="select-region" checked /> Textstellen einrahmen</label>
      </section>

      <section>
        <h2>Handschrift</h2>
        <canvas id="ink" aria-label="Zeichenfeld"></canvas>
        <div class="row">
          <button id="ink-undo">Rückgängig</button>
          <button id="ink-clear">Löschen</button>
          <span id="ink-status" class="muted"></span>
        </div>
        <ol id="ink-candidates" lang="ja"></ol>
        <textarea id="ink-text" rows="2" lang="ja" placeholder="Antippen eines Vorschlags hängt ihn hier an"></textarea>
      </section>

      <section>
        <h2>Ergebnis</h2>
        <textarea id="result" rows="6" placeholder="Erkannter Text"></textarea>
        <img id="captured-image" alt="" hidden />
        <div id="result-ruby" lang="ja"></div>
        <div id="result-words"></div>
        <div id="result-furigana"></div>
        <div class="row">
          <button id="copy">Text kopieren</button>
        </div>
        <details>
          <summary>JSON</summary>
          <pre id="json"></pre>
        </details>
      </section>

      <section>
        <h2>Log</h2>
        <pre id="log"></pre>
      </section>
    </main>

    <!-- On top of the camera picture: glossary markers (src/overlay.ts) and the live controls (src/live.ts). -->
    <div id="word-layer"></div>
    <div id="word-popup" hidden></div>

    <div id="focus-ring" hidden></div>

    <div id="live-overlay" hidden>
      <div id="live-words"></div>
      <div id="live-text"></div>
      <label id="zoom-row" class="row" hidden>
        Zoom <input id="zoom" type="range" step="0.1" /> <span id="zoom-value"></span>
      </label>
      <div class="row">
        <button id="capture" class="primary">Festhalten</button>
        <button id="resume" hidden>Weiter</button>
        <button id="torch">Licht</button>
        <button id="stop">Stopp</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
